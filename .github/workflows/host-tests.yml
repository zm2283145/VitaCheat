name: host tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with Make
        run: make test
      - name: Configure GCC with CMake and Ninja
        run: >-
          cmake -S . -B build-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
      - name: Build with GCC
        run: cmake --build build-gcc --parallel
      - name: Test GCC build
        run: ctest --test-dir build-gcc --output-on-failure

  sanitizer-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Clang sanitizers and fuzzing
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang
          -DVITACHEAT_ENABLE_SANITIZERS=ON
          -DVITACHEAT_BUILD_FUZZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Run sanitizer tests
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Run bounded search fuzzer
        run: ./build-sanitize/vitacheat_search_fuzzer -runs=10000 -max_len=520
      - name: Run bounded launch broker fuzzer
        run: ./build-sanitize/vitacheat_launch_broker_fuzzer -runs=10000 -max_len=512
      - name: Run bounded launch service fuzzer
        run: ./build-sanitize/vitacheat_launch_service_fuzzer -runs=10000 -max_len=512
      - name: Run bounded Quick Menu launcher fuzzer
        run: ./build-sanitize/vitacheat_quick_menu_launcher_fuzzer -runs=10000 -max_len=512
